<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>კავშირის შეცდომა - Grubeli.ge</title>
    <style>
        :root {
            --premium-bg: #0f141e;
            --accent-blue: #0dcaf0;
            --glass-bg: rgba(30, 35, 45, 0.98);
            --glass-border: rgba(255, 255, 255, 0.12);
        }

        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--premium-bg);
            font-family: sans-serif;
            overflow: hidden;
            width: 100%;
        }

        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(circle at 50% 50%, rgba(13, 202, 240, 0.1) 0%, transparent 70%);
        }

        .premium-glass {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            background: var(--glass-bg);
            -webkit-backdrop-filter: blur(25px);
            backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            padding: 45px 25px;
            border-radius: 32px;
            text-align: center;
            width: 85%;
            max-width: 320px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        .icon-box {
            width: 80px;
            height: 80px;
            margin: 0 auto 25px;
            background: rgba(13, 202, 240, 0.1);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        h1 {
            font-size: 1.4rem;
            margin: 0 0 12px 0;
            color: #fff;
            font-weight: 700;
        }

        p {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.6;
            margin: 0 0 35px 0;
        }

        .btn-retry {
            background: var(--accent-blue);
            color: #000;
            border: none;
            padding: 15px;
            border-radius: 16px;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
            display: block;
            outline: none;
        }

        .btn-retry:active {
            transform: scale(0.97);
            opacity: 0.9;
        }

        .loader-container {
            display: none;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 25px;
        }

        .loader-bar {
            width: 40%;
            height: 100%;
            background: var(--accent-blue);
            border-radius: 10px;
            animation: loading 1.2s infinite ease-in-out;
        }

        @keyframes loading {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
        }

        .loading-text {
            display: none;
            color: var(--accent-blue);
            font-size: 0.8rem;
            margin-top: 10px;
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="ambient-bg"></div>

<div class="premium-glass">
    <div class="icon-box">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#0dcaf0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="1" y1="1" x2="23" y2="23"></line>
            <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
            <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
            <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
            <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
            <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
    </div>

    <h1>კავშირი გაწყდა</h1>
    <p>ინტერნეტთან კავშირი არ არის. შეამოწმეთ ქსელი და სცადეთ ხელახლა.</p>

    <button class="btn-retry" id="retryBtn" onclick="onRetry()">
        ხელახლა ცდა
    </button>

    <div class="loader-container" id="loader">
        <div class="loader-bar"></div>
    </div>
    <div class="loading-text" id="loadingText">მიმდინარეობს დაკავშირება...</div>
</div>

<script>
    function onRetry() {
        const btn = document.getElementById('retryBtn');
        const loader = document.getElementById('loader');
        const text = document.getElementById('loadingText');

        btn.style.display = 'none';
        loader.style.display = 'block';
        text.style.display = 'block';

        setTimeout(() => {
            window.location.href = 'https://mprof.ge/test/index.php';
        }, 800);
    }
</script>
</body>
</html>
